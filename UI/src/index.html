<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>TallyArbiter</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.png" />
		<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
		<meta name="theme-color" content="#1976d2" />
		<script>
			// Apply the stored theme before first paint. Without this the page
			// paints light and then flips, which is why this used to be a
			// display:none FOUC hack. DarkModeService takes over once Angular boots.
			;(function () {
				try {
					var stored = localStorage.getItem('darkMode') || 'auto'
					var dark =
						stored === 'dark' || (stored === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
					document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
				} catch (e) {
					document.documentElement.setAttribute('data-bs-theme', 'light')
				}
			})()
		</script>
	</head>
	<body>
		<app-root></app-root>
		<noscript>Please enable JavaScript to continue using this application.</noscript>
	</body>
</html>
