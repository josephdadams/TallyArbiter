name: Publish to NPM

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (ex: v3.2.0)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest

    # The trusted publisher registered for `tallyarbiter` on npmjs.com names this
    # environment, so npm expects an `environment` claim in the OIDC token. Without
    # this key the token carries no such claim, the subject does not match the trust
    # policy, and the publish is rejected as an anonymous PUT — which the registry
    # reports as a 404 rather than a 403, so that it does not reveal whether a
    # package exists. Keep this in step with the Environment name field on npm.
    environment: tallyarbiter

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Node 24 for the bundled npm: trusted publishing needs npm >= 11.5.1, and
      # Node 22 still ships 10.9.x. The `permissions: id-token: write` above is
      # what lets npm mint its short-lived OIDC credential at publish time.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      # -----------------------
      # Version sanity check
      # -----------------------

      - name: Get package.json version
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get release tag version
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${GITHUB_REF#refs/tags/v}
          fi

          TAG=${TAG#v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Verify versions match
        run: |
          echo "Package: ${{ steps.pkg.outputs.version }}"
          echo "Tag:     ${{ steps.tag.outputs.version }}"

          if [ "${{ steps.pkg.outputs.version }}" != "${{ steps.tag.outputs.version }}" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi

      # -----------------------
      # Install & build
      # -----------------------

      - name: Install dependencies
        run: npm ci

      # 🔧 Build UI
      - name: Build UI
        run: |
          cd UI
          npm ci
          npm run build

      - name: Create env file
        run: |
          touch .env
          echo SENTRY_ENABLED=1 >> .env
          echo SENTRY_DSN=${{ secrets.SENTRY_DSN }} >> .env

      # Build backend
      - name: Build
        run: npm run build --if-present

      # -----------------------
      # Check if version already exists
      # -----------------------

      - name: Check if version is already published
        run: |
          if npm view tallyarbiter@${{ steps.pkg.outputs.version }} version > /dev/null 2>&1; then
            echo "❌ Version already exists on NPM!"
            exit 1
          else
            echo "✅ Version not yet published"
          fi

      # -----------------------
      # Publish
      # -----------------------

      # Published via OIDC trusted publishing, so there is no token to configure
      # and nothing to rotate. This requires a trusted publisher to be registered
      # for the package on npmjs.com, pointing at this repository and this
      # workflow filename; without it the publish is rejected as unauthenticated.
      #
      # There is deliberately no `npm whoami` check here. OIDC authenticates
      # during the publish itself, so whoami does not reflect it and would fail.
      #
      # --provenance is also omitted on purpose: trusted publishing generates and
      # signs the attestation automatically.
      - name: Publish to NPM
        run: npm publish --access public
