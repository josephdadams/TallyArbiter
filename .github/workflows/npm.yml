name: Publish to NPM

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (ex: v3.2.0)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      # -----------------------
      # Credential sanity check
      # -----------------------

      - name: Verify NPM token is configured
        run: |
          if [ -z "${{ secrets.NPM_ACCESS_TOKEN }}" ]; then
            echo "❌ Repository secret NPM_ACCESS_TOKEN is not set — publish would fail with ENEEDAUTH."
            exit 1
          fi
          echo "✅ NPM token present"

      # -----------------------
      # Version sanity check
      # -----------------------

      - name: Get package.json version
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get release tag version
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${GITHUB_REF#refs/tags/v}
          fi

          TAG=${TAG#v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Verify versions match
        run: |
          echo "Package: ${{ steps.pkg.outputs.version }}"
          echo "Tag:     ${{ steps.tag.outputs.version }}"

          if [ "${{ steps.pkg.outputs.version }}" != "${{ steps.tag.outputs.version }}" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi

      # -----------------------
      # Install & build
      # -----------------------

      - name: Install dependencies
        run: npm ci

      # 🔧 Build UI
      - name: Build UI
        run: |
          cd UI
          npm ci
          npm run build

      - name: Create env file
        run: |
          touch .env
          echo SENTRY_ENABLED=1 >> .env
          echo SENTRY_DSN=${{ secrets.SENTRY_DSN }} >> .env

      # Build backend
      - name: Build
        run: npm run build --if-present

      # -----------------------
      # Check if version already exists
      # -----------------------

      - name: Check if version is already published
        run: |
          if npm view tallyarbiter@${{ steps.pkg.outputs.version }} version > /dev/null 2>&1; then
            echo "❌ Version already exists on NPM!"
            exit 1
          else
            echo "✅ Version not yet published"
          fi

      # -----------------------
      # Publish
      # -----------------------

      # setup-node's registry-url writes an .npmrc pointing at ${NODE_AUTH_TOKEN},
      # so every step that authenticates against the registry has to export it.

      - name: Who Am I
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
