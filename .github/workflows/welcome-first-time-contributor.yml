name: Welcome first time contributors

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened

jobs:
  welcome:
    runs-on: ubuntu-latest
    # The action comments on the new issue or PR, which the default token cannot do
    # when the repository's workflow permissions are read-only.
    permissions:
      issues: write
      pull-requests: write
    steps:
      # v3 renamed every input from hyphens to underscores. The hyphenated v1/v2
      # spellings are not recognised, and the action then fails on the first one it
      # needs with "Input required and not supplied: issue_message".
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Hello there ${{ github.actor }} 👋

            Welcome to TallyArbiter!

            Thank you for opening your first issue for the Tally Arbiter project. Tally Arbiter fosters an open and welcoming environment for all our contributors. Please adhere to our [Code Of Conduct](https://github.com/josephdadams/TallyArbiter/blob/HEAD/CODE_OF_CONDUCT.md).

            If you have more to contribute to this issue, please comment down below! We will try to get back to you as soon as we can.

          pr_message: |
            Hello there ${{ github.actor }} 👋

            Thank you for opening your first PR for the Tally Arbiter project!

            We will review it soon!

            TallyArbiter fosters an open and welcoming environment for all our contributors. Please adhere to our [Code Of Conduct](https://github.com/josephdadams/TallyArbiter/blob/HEAD/CODE_OF_CONDUCT.md).
