name: Build Listener Clients

on:
  push:
    paths:
      - 'listener_clients/**'
      - '.github/workflows/build-listener-clients.yaml'
  pull_request:
    paths:
      - 'listener_clients/**'
      - '.github/workflows/build-listener-clients.yaml'
  workflow_dispatch:
  # Called by release-listener-clients.yaml on a version tag. A `tags` filter
  # can't live alongside the `paths` filter above (they are ANDed, and a tag
  # push carries no file diff to match), so the tag trigger lives in its own
  # workflow that calls this one.
  workflow_call:

jobs:
  build_m5stickc-listener:
    name: Build M5StickC Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://dl.espressif.com/dl/package_esp32_index.json
          fqbn: 'esp32:esp32:m5stack_stickc'
          libraries: |
            - source-url: https://github.com/m5stack/M5StickC/archive/refs/tags/0.3.0.zip
            - source-url: https://github.com/m5stack/M5StickC-Plus/archive/refs/tags/0.1.0.zip
            - name: WebSockets
            - name: WiFiManager
            - name: MultiButton
            - name: Arduino_JSON
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - listener_clients/m5stickc-listener
          enable-deltas-report: true
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-M5StickC'
          path: 'listener_clients/m5stickc-listener/build/esp32.esp32.m5stack_stickc'

  build_m5sticks3-listener:
    name: Build M5StickS3 Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          # M5StickS3 is not in the espressif core; it only ships in the M5Stack
          # platform, from 3.3.8 onwards.
          platforms: |
            - name: m5stack:esp32
              source-url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          # The board has 8 MB of flash but its default scheme is the 4 MB layout,
          # leaving only 1.25 MB for the app. default_8MB gives 3.19 MB and keeps
          # the second OTA partition ArduinoOTA needs, unlike huge_app.
          fqbn: 'm5stack:esp32:m5stack_sticks3:PartitionScheme=default_8MB'
          libraries: |
            - name: M5Unified
            - name: M5GFX
            - name: WebSockets
            - name: WiFiManager
            - name: Arduino_JSON
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - listener_clients/M5StickS3
          enable-deltas-report: true
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-M5StickS3'
          path: 'listener_clients/M5StickS3/build/m5stack.esp32.m5stack_sticks3'

  build_m5atom-listener:
    name: Build M5Atom Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://dl.espressif.com/dl/package_esp32_index.json
          fqbn: 'esp32:esp32:m5stack_atom'
          libraries: |
            - source-url: https://github.com/m5stack/M5Atom/archive/refs/tags/0.1.3.zip
            - name: WebSockets
            - name: WiFiManager
            - name: MultiButton
            - name: Arduino_JSON
            - name: FastLED
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - listener_clients/M5AtomMatrix-listener/tallyarbiter-m5atom
          enable-deltas-report: true
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-M5Atom'
          path: 'listener_clients/M5AtomMatrix-listener/tallyarbiter-m5atom/build/esp32.esp32.m5stack_atom'

  build_esp32-neopixel-listener:
    name: Build ESP32 NeoPixel Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://dl.espressif.com/dl/package_esp32_index.json
          # min_spiffs, not huge_app: the sketch uses ArduinoOTA, which needs the
          # second app partition that huge_app removes. This raises the app limit
          # from 1.25 MB to 1.875 MB and shrinks SPIFFS, which the sketch does not
          # use (it stores config in Preferences/NVS).
          fqbn: 'esp32:esp32:esp32:PartitionScheme=min_spiffs'
          libraries: |
            - name: WebSockets
            - name: WiFiManager
            - name: MultiButton
            - name: Arduino_JSON
            - name: Adafruit NeoPixel
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - listener_clients/esp32-neopixel-listener
          enable-deltas-report: true
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-ESP32-NeoPixel'
          path: 'listener_clients/esp32-neopixel-listener/build/esp32.esp32.esp32'

  build_esp32-c3-neopixel-listener:
    name: Build ESP32-C3 NeoPixel Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://dl.espressif.com/dl/package_esp32_index.json
          # Same reasoning as the plain ESP32 sketch: min_spiffs for the app
          # size, while keeping the OTA partition ArduinoOTA needs.
          fqbn: 'esp32:esp32:esp32c3:PartitionScheme=min_spiffs'
          libraries: |
            - name: WebSockets
            - name: WiFiManager
            - name: Arduino_JSON
            - name: Adafruit NeoPixel
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - listener_clients/esp32-c3-neopixel-listener
          enable-deltas-report: true
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-ESP32-C3-NeoPixel'
          path: 'listener_clients/esp32-c3-neopixel-listener/build/esp32.esp32.esp32c3'

  build_TTGO-listener:
    strategy:
      fail-fast: false
      matrix:
        # These three default to a 1.25 MB app partition, which this sketch no
        # longer fits in. min_spiffs raises it to 1.875 MB and keeps the second
        # OTA partition that ArduinoOTA needs. T-Watch has 16 MB flash and
        # already gets 6.5 MB by default, and does not offer the option at all.
        board:
          - fqbn: esp32:esp32:ttgo-t1
            name: TTGO T1
            options: ':PartitionScheme=min_spiffs'
          - fqbn: esp32:esp32:ttgo-t7-v13-mini32
            name: TTGO T7 v13 Mini32
            options: ':PartitionScheme=min_spiffs'
          - fqbn: esp32:esp32:ttgo-t7-v14-mini32
            name: TTGO T7 v14 Mini32
            options: ':PartitionScheme=min_spiffs'
          - fqbn: esp32:esp32:twatch
            name: TTGO T-Watch
            options: ''
    name: Build ${{ matrix.board.name }} Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup TFT_eSPI and select User Setup
        run: |
          git clone https://github.com/Bodmer/TFT_eSPI/
          cd TFT_eSPI
          sed -i 's/#include <User_Setup.h>/\/\/#include <User_Setup.h>/g' User_Setup_Select.h
          sed -i 's/\/\/#include <User_Setups\/Setup22_TTGO_T4.h>/#include <User_Setups\/Setup22_TTGO_T4.h>/g' User_Setup_Select.h
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://dl.espressif.com/dl/package_esp32_index.json
          fqbn: '${{ matrix.board.fqbn }}${{ matrix.board.options }}'
          libraries: |
            - name: WebSockets
            - name: WiFiManager
            - name: MultiButton
            - name: Arduino_JSON
            - source-path: TFT_eSPI
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - listener_clients/TTGO_T-listener
          enable-deltas-report: true
      - name: Get FQBN build dir for ${{ matrix.board.name }}
        run: |
          RAW_FQBN="${{ matrix.board.fqbn }}"
          FQBN_REPLACED=$(echo $RAW_FQBN | sed 's/:/./g')
          echo "FQBN_REPLACED=$FQBN_REPLACED" >> $GITHUB_ENV
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-${{ matrix.board.name }}'
          path: 'listener_clients/TTGO_T-listener/build/${{ env.FQBN_REPLACED }}'

  analyse_blink1-listener:
    name: Analyse Blink1 Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prosepector
        run: pip install prospector[with_everything]
      - name: Analyse
        working-directory: listener_clients/blink1-listener
        run: prospector -W pyroma -0

  analyse_blinkt-listener:
    name: Analyse Pimoroni Blinkt Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prosepector
        run: pip install prospector[with_everything]
      - name: Analyse
        working-directory: listener_clients/pimoroni-blinkt-listener
        run: prospector -W pyroma -0

  analyse_gpo-listener:
    name: Analyse GPO Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prosepector
        run: pip install prospector[with_everything]
      - name: Analyse
        working-directory: listener_clients/gpo-listener
        run: prospector -W pyroma -0

  analyse_relay-listener:
    name: Analyse Relay Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      #- name: Install dependencies
      #  working-directory: listener_clients/relay-listener
      #  run: |
      #    sudo apt install libudev-dev libusb-1.0-0 libusb-1.0-0-dev
      #    npm install
      #    npm install --global eslint
      #- name: Run eslint
      #  working-directory: listener_clients/relay-listener
      #  run: eslint index.js || exit 0

  attach_to_release:
    name: Attach Firmware to Release
    # Only on a version tag, i.e. when release-listener-clients.yaml called us.
    # `!cancelled()` instead of the default `success()` so one board failing to
    # compile does not also cost the release the firmware that did build — the
    # failed build job is still red on the run either way.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build_m5stickc-listener
      - build_m5sticks3-listener
      - build_m5atom-listener
      - build_esp32-neopixel-listener
      - build_esp32-c3-neopixel-listener
      - build_TTGO-listener
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'TallyArbiter-Listener-*'

      - name: Zip one archive per board
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            # Some artifact names contain spaces (ex: "TTGO T1").
            asset="${name// /-}-${TAG}.zip"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release-assets/$asset" .)
          done
          ls -l release-assets

      - name: Wait for the release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh can't infer the repo from a remote.
          GH_REPO: ${{ github.repository }}
        run: |
          # build-desktop.yml runs off the same tag push and electron-builder
          # creates the draft release, but only once its slowest OS finishes.
          # Firmware compiles well before that, so wait for the draft instead of
          # racing it and creating a second, conflicting release.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Release $TAG not created yet (attempt $i/60), waiting 30s..."
            sleep 30
          done
          echo "Release $TAG never appeared; creating a draft to hold the firmware."
          gh release create "$TAG" --draft --title "$TAG" \
            --notes "Draft created by the listener client build; the desktop build did not create a release for this tag."

      - name: Upload firmware to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh can't infer the repo from a remote.
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No firmware archives were produced — nothing to attach."
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
