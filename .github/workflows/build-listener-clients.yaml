name: Build Listener Clients

on:
  push:
    paths:
      - 'listener_clients/**'
      - '.github/workflows/build-listener-clients.yaml'
  pull_request:
    paths:
      - 'listener_clients/**'
      - '.github/workflows/build-listener-clients.yaml'
  workflow_dispatch:
  # Called by release-listener-clients.yaml on a version tag. A `tags` filter
  # can't live alongside the `paths` filter above (they are ANDed, and a tag
  # push carries no file diff to match), so the tag trigger lives in its own
  # workflow that calls this one.
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag of the release to attach the firmware to. Defaults to the tag that triggered the caller.'
        required: false
        type: string
        default: ''

jobs:
  build_listeners:
    # Boards that need nothing beyond a platform, libraries and a partition
    # scheme share this job. The TTGO sketch needs a patched TFT_eSPI checked
    # out first, so it stays separate below.
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: M5StickC
            artifact: M5StickC
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:m5stack_stickc
            options: ''
            sketch: listener_clients/m5stickc-listener
            libraries: |
              - source-url: https://github.com/m5stack/M5StickC/archive/refs/tags/0.3.0.zip
              - source-url: https://github.com/m5stack/M5StickC-Plus/archive/refs/tags/0.1.0.zip
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON

          # M5StickS3 is not in the espressif core; it only ships in the M5Stack
          # platform, from 3.3.8 onwards. The board has 8 MB of flash but its
          # default scheme is the 4 MB layout, leaving only 1.25 MB for the app.
          # default_8MB gives 3.19 MB and keeps the second OTA partition
          # ArduinoOTA needs, unlike huge_app.
          - name: M5StickS3
            artifact: M5StickS3
            platform_name: m5stack:esp32
            platform_url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
            fqbn: m5stack:esp32:m5stack_sticks3
            options: ':PartitionScheme=default_8MB'
            sketch: listener_clients/M5StickS3
            libraries: |
              - name: M5Unified
              - name: M5GFX
              - name: WebSockets
              - name: WiFiManager
              - name: Arduino_JSON

          - name: M5Atom
            artifact: M5Atom
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:m5stack_atom
            options: ''
            sketch: listener_clients/M5AtomMatrix-listener/tallyarbiter-m5atom
            libraries: |
              - source-url: https://github.com/m5stack/M5Atom/archive/refs/tags/0.1.3.zip
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON
              - name: FastLED

          # min_spiffs, not huge_app: these sketches use ArduinoOTA, which needs
          # the second app partition that huge_app removes. This raises the app
          # limit from 1.25 MB to 1.875 MB and shrinks SPIFFS, which they do not
          # use (they store config in Preferences/NVS).
          - name: ESP32 NeoPixel
            artifact: ESP32-NeoPixel
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:esp32
            options: ':PartitionScheme=min_spiffs'
            sketch: listener_clients/esp32-neopixel-listener
            libraries: |
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON
              - name: Adafruit NeoPixel

          - name: ESP32-C3 NeoPixel
            artifact: ESP32-C3-NeoPixel
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:esp32c3
            options: ':PartitionScheme=min_spiffs'
            sketch: listener_clients/esp32-c3-neopixel-listener
            libraries: |
              - name: WebSockets
              - name: WiFiManager
              - name: Arduino_JSON
              - name: Adafruit NeoPixel

          # The TTGO sketch needs a TFT_eSPI patched to select the TTGO T4 user
          # setup, checked out by the conditional step below. The first three
          # boards default to a 1.25 MB app partition, which this sketch no
          # longer fits in; min_spiffs raises it to 1.875 MB and keeps the second
          # OTA partition ArduinoOTA needs. T-Watch has 16 MB flash, already gets
          # 6.5 MB by default, and does not offer the option at all.
          - name: TTGO T1
            artifact: TTGO T1
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:ttgo-t1
            options: ':PartitionScheme=min_spiffs'
            sketch: listener_clients/TTGO_T-listener
            tft_espi: true
            libraries: |
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON
              - source-path: TFT_eSPI

          - name: TTGO T7 v13 Mini32
            artifact: TTGO T7 v13 Mini32
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:ttgo-t7-v13-mini32
            options: ':PartitionScheme=min_spiffs'
            sketch: listener_clients/TTGO_T-listener
            tft_espi: true
            libraries: |
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON
              - source-path: TFT_eSPI

          - name: TTGO T7 v14 Mini32
            artifact: TTGO T7 v14 Mini32
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:ttgo-t7-v14-mini32
            options: ':PartitionScheme=min_spiffs'
            sketch: listener_clients/TTGO_T-listener
            tft_espi: true
            libraries: |
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON
              - source-path: TFT_eSPI

          - name: TTGO T-Watch
            artifact: TTGO T-Watch
            platform_name: esp32:esp32
            platform_url: https://dl.espressif.com/dl/package_esp32_index.json
            fqbn: esp32:esp32:twatch
            options: ''
            sketch: listener_clients/TTGO_T-listener
            tft_espi: true
            libraries: |
              - name: WebSockets
              - name: WiFiManager
              - name: MultiButton
              - name: Arduino_JSON
              - source-path: TFT_eSPI
    name: Build ${{ matrix.board.name }} Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup TFT_eSPI and select User Setup
        if: matrix.board.tft_espi
        run: |
          git clone https://github.com/Bodmer/TFT_eSPI/
          cd TFT_eSPI
          sed -i 's/#include <User_Setup.h>/\/\/#include <User_Setup.h>/g' User_Setup_Select.h
          sed -i 's/\/\/#include <User_Setups\/Setup22_TTGO_T4.h>/#include <User_Setups\/Setup22_TTGO_T4.h>/g' User_Setup_Select.h
      # arduino/compile-sketches downloads arduino-cli on every run, and that
      # download occasionally resets mid-transfer. Retry once rather than lose
      # a board's firmware to a transient network failure — the release attach
      # job ships whatever built, so a flake here silently costs an asset.
      - name: Compile sketch
        id: compile
        continue-on-error: true
        uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: ${{ matrix.board.platform_name }}
              source-url: ${{ matrix.board.platform_url }}
          fqbn: '${{ matrix.board.fqbn }}${{ matrix.board.options }}'
          libraries: ${{ matrix.board.libraries }}
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - ${{ matrix.board.sketch }}
          enable-deltas-report: true
      - name: Compile sketch (retry)
        if: steps.compile.outcome == 'failure'
        uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: ${{ matrix.board.platform_name }}
              source-url: ${{ matrix.board.platform_url }}
          fqbn: '${{ matrix.board.fqbn }}${{ matrix.board.options }}'
          libraries: ${{ matrix.board.libraries }}
          cli-compile-flags: |
            - --export-binaries
          sketch-paths: |
            - ${{ matrix.board.sketch }}
          enable-deltas-report: true
      - name: Get FQBN build dir for ${{ matrix.board.name }}
        run: echo "FQBN_REPLACED=$(echo '${{ matrix.board.fqbn }}' | tr ':' '.')" >> "$GITHUB_ENV"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'TallyArbiter-Listener-${{ matrix.board.artifact }}'
          path: '${{ matrix.board.sketch }}/build/${{ env.FQBN_REPLACED }}'

  analyse_blink1-listener:
    name: Analyse Blink1 Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prosepector
        run: pip install prospector[with_everything]
      - name: Analyse
        working-directory: listener_clients/blink1-listener
        run: prospector -W pyroma -0

  analyse_blinkt-listener:
    name: Analyse Pimoroni Blinkt Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prosepector
        run: pip install prospector[with_everything]
      - name: Analyse
        working-directory: listener_clients/pimoroni-blinkt-listener
        run: prospector -W pyroma -0

  analyse_gpo-listener:
    name: Analyse GPO Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prosepector
        run: pip install prospector[with_everything]
      - name: Analyse
        working-directory: listener_clients/gpo-listener
        run: prospector -W pyroma -0

  analyse_relay-listener:
    name: Analyse Relay Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      #- name: Install dependencies
      #  working-directory: listener_clients/relay-listener
      #  run: |
      #    sudo apt install libudev-dev libusb-1.0-0 libusb-1.0-0-dev
      #    npm install
      #    npm install --global eslint
      #- name: Run eslint
      #  working-directory: listener_clients/relay-listener
      #  run: eslint index.js || exit 0

  attach_to_release:
    name: Attach Firmware to Release
    # Only when release-listener-clients.yaml called us, either off a version
    # tag or with an explicit tag to attach to.
    # `!cancelled()` instead of the default `success()` so one board failing to
    # compile does not also cost the release the firmware that did build — the
    # failed build job is still red on the run either way.
    if: ${{ !cancelled() && (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')) }}
    needs:
      - build_listeners
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          echo "Attaching firmware to release $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'TallyArbiter-Listener-*'

      - name: Zip one archive per board
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            # Some artifact names contain spaces (ex: "TTGO T1").
            asset="${name// /-}-${TAG}.zip"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release-assets/$asset" .)
          done
          ls -l release-assets

      - name: Wait for the release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh can't infer the repo from a remote.
          GH_REPO: ${{ github.repository }}
        run: |
          # build-desktop.yml runs off the same tag push and electron-builder
          # creates the draft release, but only once its slowest OS finishes.
          # Firmware compiles well before that, so wait for the draft instead of
          # racing it and creating a second, conflicting release.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Release $TAG not created yet (attempt $i/60), waiting 30s..."
            sleep 30
          done
          echo "Release $TAG never appeared; creating a draft to hold the firmware."
          gh release create "$TAG" --draft --title "$TAG" \
            --notes "Draft created by the listener client build; the desktop build did not create a release for this tag."

      - name: Upload firmware to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh can't infer the repo from a remote.
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No firmware archives were produced — nothing to attach."
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
