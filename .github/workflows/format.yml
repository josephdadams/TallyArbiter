name: Format

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # --ignore-scripts skips the postinstall work (the Electron download and
      # friends) that a formatting check has no use for, which keeps this job to
      # seconds rather than minutes. Prettier is pure JS and has no install
      # scripts of its own, so nothing it needs is skipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Uses the repo's own pinned Prettier and .prettierrc rather than a
      # floating npx version, so CI and `npm run format` can never disagree.
      - name: Check formatting
        run: npm run format:check

      - name: How to fix
        if: failure()
        run: |
          echo "::error::Some files are not formatted. Run 'npm run format' locally and commit the result."
          exit 1
