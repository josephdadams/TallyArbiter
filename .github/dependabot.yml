# Dependabot alerts were already enabled, but with no version-update config nothing
# ever opened a PR, so 43 open alerts accumulated. Everything below is grouped so a
# week's updates arrive as a handful of reviewable PRs rather than dozens of
# single-package ones.
version: 2

updates:
  # The server that actually ships to users. Highest priority — anything vulnerable
  # here is in the request path or in an outbound connection to a switcher.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      server-production:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      server-development:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    # Electron and electron-builder majors change packaging and code-signing
    # behaviour, so they get looked at deliberately rather than arriving in a
    # grouped batch. Minor and patch updates still come through above.
    ignore:
      - dependency-name: 'electron'
        update-types: ['version-update:semver-major']
      - dependency-name: 'electron-builder'
        update-types: ['version-update:semver-major']
      # TypeScript 7 removed moduleResolution=node10 and downlevelIteration and now
      # requires an explicit rootDir -- all three are in tsconfig.json, so the bump
      # cannot compile without a config migration first (see #1145).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Angular front end. Most of this tree is build tooling that never reaches a
  # browser, so it is grouped tightly to keep the noise down.
  - package-ecosystem: 'npm'
    directory: '/UI'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    groups:
      ui-all:
        patterns: ['*']
        exclude-patterns: ['@angular*', '@angular-devkit*']
        update-types: ['minor', 'patch']
    # Angular is excluded from version updates entirely, not just majors. The first
    # run produced #1139, which failed to install: the group moved @angular/core to
    # 21.2.18 while @angular/animations only had 21.2.17 published, and npm refused
    # the peer mismatch. Grouping cannot fix that -- it is upstream publishing lag,
    # and it would recur on any release where the packages land unevenly. Angular is
    # meant to be updated with `ng update`, which resolves the whole framework
    # together. Security advisories still come through as Dependabot security
    # updates, which this ignore list does not suppress.
    ignore:
      - dependency-name: '@angular*'
      - dependency-name: '@angular-devkit*'
      # Same major-version ignore the server block carries, for a different reason:
      # @angular-devkit/build-angular declares peer typescript ">=5.9 <6.0", so any
      # major past 5 makes `npm ci` fail outright with ERESOLVE and takes the Docker
      # image build with it. #1158 bumped this to 7.0.2 and broke CI on main until it
      # was reverted. TypeScript here moves with Angular, via `ng update`.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # ang-jsoneditor 6 dropped NgJsonEditorModule in favour of standalone
      # components, so a version bump alone cannot build (see #1140). Needs a code
      # migration in settings.component.ts and app.module.ts first.
      - dependency-name: 'ang-jsoneditor'
        update-types: ['version-update:semver-major']

  # Docusaurus site. Build-time only: the output is static HTML deployed to
  # gh-pages, so nothing here is ever executed by a user or by the server.
  # Monthly and tightly grouped, so it stops drowning out the alerts that matter.
  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      docs-all:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Runs on users' machines (Raspberry Pi and similar), so it does matter, but it
  # is a small tree that changes rarely.
  - package-ecosystem: 'npm'
    directory: '/listener_clients/relay-listener'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      relay-listener-all:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Pinned action versions in .github/workflows go stale silently and are a supply
  # chain surface of their own.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ['*']
